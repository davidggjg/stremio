name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK, so only the pieces this
      # project pins are installed. (android-actions/setup-android is avoided: it
      # installs the retired "tools" package, which no longer exists in the
      # repository and fails the job.)
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      # Optional: when the repository has a signing key configured, release APKs are signed with
      # it so every build installs over the previous one. Without the secrets the build still
      # works and falls back to the debug key.
      - name: Restore signing key
        if: ${{ secrets.STREMIO_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.STREMIO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stremio-release.keystore"
          echo "STREMIO_KEYSTORE=$RUNNER_TEMP/stremio-release.keystore" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        env:
          STREMIO_KEYSTORE_PASSWORD: ${{ secrets.STREMIO_KEYSTORE_PASSWORD }}
          STREMIO_KEY_ALIAS: ${{ secrets.STREMIO_KEY_ALIAS }}
          STREMIO_KEY_PASSWORD: ${{ secrets.STREMIO_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: stremio-lite-apks
          path: app/build/outputs/apk/*/*.apk
