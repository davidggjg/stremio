name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK, so only the pieces this
      # project pins are installed. (android-actions/setup-android is avoided: it
      # installs the retired "tools" package, which no longer exists in the
      # repository and fails the job.)
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: stremio-lite-apks
          path: app/build/outputs/apk/*/*.apk

      # A rolling "latest" release gives one stable, login-free link that opens straight from a
      # phone, instead of an artifact zip holding every ABI in both build types. The release is
      # created once and its files are replaced in place on later builds.
      - name: Publish the installable APK
        if: github.ref_name == 'claude/stremio-android-app-mv8iv5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/StremioLite-arm64.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/StremioLite-universal.apk"
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Stremio Lite (latest build)" \
            --notes "Rolling build of the newest commit."
          gh release upload latest dist/StremioLite-arm64.apk dist/StremioLite-universal.apk --clobber
          gh release edit latest \
            --title "Stremio Lite $version (build ${{ github.run_number }})" \
            --notes "Install **StremioLite-arm64.apk** on a phone. Built from ${{ github.sha }}."
